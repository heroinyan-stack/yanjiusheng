<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壁纸管理后台</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #6C5CE7;
  --primary-light: #a29bfe;
  --danger: #e74c3c;
  --success: #00b894;
  --warning: #fdcb6e;
  --bg: #f5f6fa;
  --card: #ffffff;
  --text: #2d3436;
  --text-muted: #636e72;
  --border: #dfe6e9;
  --radius: 10px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
/* Header */
.header {
  background: linear-gradient(135deg, var(--primary), #8e44ad);
  color: #fff;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header h1 { font-size: 20px; font-weight: 600; }
.header-right { display: flex; gap: 12px; align-items: center; }
.version-badge {
  background: rgba(255,255,255,0.2);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}
/* Config bar */
.config-bar {
  background: var(--card);
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.config-bar input {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.config-bar input:focus { border-color: var(--primary); }
.config-bar input[type="text"] { min-width: 320px; }
.config-bar input[type="password"] { min-width: 320px; }
.btn {
  padding: 8px 18px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #5a4bd1; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { opacity: 0.9; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
/* Layout */
.main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  background: var(--card);
  padding: 6px;
  border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.tab {
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  color: var(--text-muted);
  white-space: nowrap;
}
.tab:hover { background: var(--bg); }
.tab.active { background: var(--primary); color: #fff; }
.tab .count {
  font-size: 11px;
  background: rgba(0,0,0,0.1);
  padding: 1px 7px;
  border-radius: 999px;
  margin-left: 4px;
}
.tab.active .count { background: rgba(255,255,255,0.25); }
/* Grid */
.wallpaper-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.wallpaper-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}
.wallpaper-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.wallpaper-card img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  background: #eee;
}
.wallpaper-card .img-error {
  width: 100%;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0f0f0;
  color: #aaa;
  font-size: 12px;
}
.wallpaper-info {
  padding: 10px 14px;
}
.wallpaper-id {
  font-size: 12px;
  color: var(--text-muted);
  font-family: monospace;
}
.wallpaper-source {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  margin-left: 6px;
}
.wallpaper-source.netbian { background: #e17055; }
.wallpaper-source.unsplash { background: #00b894; }
.wallpaper-source.wallhaven { background: #fd79a8; }
.wallpaper-source.wallpaperflare { background: #fdcb6e; color: #333; }
.wallpaper-source.pixabay { background: #0984e3; }
.wallpaper-source.custom { background: #636e72; }
.wallpaper-actions {
  padding: 0 14px 12px;
  display: flex;
  gap: 8px;
}
/* Add panel */
.add-panel {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  display: none;
}
.add-panel.show { display: block; }
.add-panel h3 { font-size: 16px; margin-bottom: 14px; }
.add-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.add-row input, .add-row select {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
}
.add-row input:focus, .add-row select:focus { border-color: var(--primary); }
.add-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.preview-img {
  width: 120px;
  height: 180px;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  z-index: 9999;
  transition: transform 0.3s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
/* Loading */
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  font-size: 16px;
  color: var(--primary);
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Empty state */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty p { font-size: 16px; margin-bottom: 12px; }
/* Stats */
.stats-bar {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--card);
  padding: 16px 24px;
  border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  min-width: 120px;
}
.stat-value { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
/* Search */
.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  align-items: center;
}
.search-bar input {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  flex: 1;
  max-width: 300px;
  outline: none;
}
.search-bar input:focus { border-color: var(--primary); }
</style>
</head>
<body>

<div class="header">
  <h1>壁纸管理后台</h1>
  <div class="header-right">
    <span class="version-badge" id="versionBadge">未连接</span>
    <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;" onclick="toggleAddPanel()">+ 添加壁纸</button>
    <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:#fff;" onclick="saveToGithub()">💾 保存到GitHub</button>
  </div>
</div>

<!-- Config bar -->
<div class="config-bar">
  <input type="text" id="repoInput" placeholder="GitHub仓库 (owner/repo)" value="heroinyan-stack/yanjiusheng">
  <input type="text" id="pathInput" placeholder="文件路径" value="remote-config.json">
  <input type="text" id="branchInput" placeholder="分支" value="main" style="max-width:80px;">
  <input type="password" id="tokenInput" placeholder="GitHub Token (ghp_xxx...)">
  <button class="btn btn-primary" onclick="loadConfig()">连接并加载</button>
</div>

<div class="main">
  <!-- Stats -->
  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat-card"><div class="stat-value" id="totalWp">0</div><div class="stat-label">壁纸总数</div></div>
    <div class="stat-card"><div class="stat-value" id="totalCat">0</div><div class="stat-label">分类数</div></div>
    <div class="stat-card"><div class="stat-value" id="totalBanner">0</div><div class="stat-label">Banner数</div></div>
  </div>

  <!-- Add panel -->
  <div class="add-panel" id="addPanel">
    <h3>添加壁纸</h3>
    <div class="add-row">
      <select id="addCategory">
        <option value="">选择分类</option>
      </select>
      <select id="addSource" onchange="onSourceChange()">
        <option value="pexels">Pexels (输入图片ID)</option>
        <option value="custom">自定义URL</option>
        <option value="upload">📂 本地上传</option>
      </select>
      <input type="text" id="addIdOrUrl" placeholder="Pexels图片ID (如 19999456) 或 完整图片URL" style="min-width:280px;">
      <input type="file" id="addFileInput" accept="image/*" multiple style="display:none;" onchange="onFileSelected()">
      <button class="btn btn-primary" onclick="previewAdd()" id="previewBtn">预览</button>
      <button class="btn btn-success" onclick="confirmAdd()">确认添加</button>
    </div>
    <div class="add-hint" id="addHint">输入Pexels图片ID后点击预览，确认图片内容后添加。支持批量添加：用逗号分隔多个ID。</div>
    <div id="addPreview" style="margin-top:12px;"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="categoryTabs"></div>

  <!-- Search -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索ID或来源..." oninput="renderGrid()">
  </div>

  <!-- Grid -->
  <div class="wallpaper-grid" id="wallpaperGrid"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <span id="loadingText">加载中...</span>
</div>

<script>
// ============ 全局状态 ============
var config = null;
var currentCategory = '';
var configSha = '';
var GITHUB_API = 'https://api.github.com';

// ============ 工具函数 ============
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || '加载中...';
  document.getElementById('loadingOverlay').classList.add('show');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}

function buildPexelsUrl(id, width) {
  var w = width || 400;
  return 'https://images.pexels.com/photos/' + id + '/pexels-photo-' + id + '.jpeg?auto=compress&cs=tinysrgb&w=' + w;
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ============ GitHub API ============
async function loadConfig() {
  var repo = document.getElementById('repoInput').value.trim();
  var path = document.getElementById('pathInput').value.trim();
  var branch = document.getElementById('branchInput').value.trim();
  var token = document.getElementById('tokenInput').value.trim();

  if (!repo || !token) {
    showToast('请填写仓库和Token', 'error');
    return;
  }

  showLoading('从GitHub加载配置...');
  try {
    var url = GITHUB_API + '/repos/' + repo + '/contents/' + path + '?ref=' + branch;
    var res = await fetch(url, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    configSha = data.sha;

    // 正确解码UTF-8中文（atob不支持多字节字符）
    var raw = atob(data.content.replace(/\n/g, ''));
    var bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    var content = new TextDecoder('utf-8').decode(bytes);
    config = JSON.parse(content);

    document.getElementById('versionBadge').textContent = 'v' + config.version;
    renderTabs();
    renderStats();
    showToast('加载成功！v' + config.version, 'success');
  } catch (err) {
    showToast('加载失败: ' + err.message, 'error');
    console.error(err);
  }
  hideLoading();
}

async function saveToGithub() {
  if (!config) { showToast('请先加载配置', 'error'); return; }

  var repo = document.getElementById('repoInput').value.trim();
  var path = document.getElementById('pathInput').value.trim();
  var branch = document.getElementById('branchInput').value.trim();
  var token = document.getElementById('tokenInput').value.trim();

  // 版本号自动+1
  var parts = (config.version || '1.0.0').split('.').map(Number);
  parts[2] = (parts[2] || 0) + 1;
  config.version = parts.join('.');
  config.updatedAt = new Date().toISOString().slice(0, 10);

  showLoading('保存到GitHub...');

  var content = btoa(unescape(encodeURIComponent(JSON.stringify(config, null, 2))));

  try {
    var url = GITHUB_API + '/repos/' + repo + '/contents/' + path;
    var res = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: 'v' + config.version + ' 壁纸更新 ' + config.updatedAt,
        content: content,
        sha: configSha,
        branch: branch
      })
    });

    if (!res.ok) {
      var errData = await res.json();
      throw new Error(errData.message || 'HTTP ' + res.status);
    }
    var data = await res.json();
    configSha = data.content.sha;
    document.getElementById('versionBadge').textContent = 'v' + config.version;
    showToast('保存成功！v' + config.version + ' 已推送', 'success');

    // 刷新CDN缓存
    try {
      await fetch('https://purge.jsdelivr.net/gh/' + repo + '@' + branch + '/' + path);
      showToast('CDN缓存已刷新', 'success');
    } catch(e) {}
  } catch (err) {
    showToast('保存失败: ' + err.message, 'error');
    console.error(err);
  }
  hideLoading();
}

// ============ 渲染 ============
function renderTabs() {
  if (!config) return;
  var tabs = document.getElementById('categoryTabs');
  var cats = config.categories || [];
  var html = '';

  cats.forEach(function(cat) {
    var count = 0;
    if (config.wallpaperItems && config.wallpaperItems[cat.key]) {
      count = config.wallpaperItems[cat.key].length;
    } else if (config.wallpaperIds && config.wallpaperIds[cat.key]) {
      count = config.wallpaperIds[cat.key].length;
    }
    var active = (cat.key === currentCategory) ? ' active' : '';
    html += '<div class="tab' + active + '" onclick="selectCategory(\'' + cat.key + '\')">' +
            escapeHtml(cat.name) + '<span class="count">' + count + '</span></div>';
  });

  tabs.innerHTML = html;

  // 填充添加面板的分类下拉
  var select = document.getElementById('addCategory');
  select.innerHTML = '<option value="">选择分类</option>';
  cats.forEach(function(cat) {
    select.innerHTML += '<option value="' + cat.key + '">' + escapeHtml(cat.name) + ' (' + cat.key + ')</option>';
  });

  if (!currentCategory && cats.length > 0) {
    selectCategory(cats[0].key);
  }
}

function selectCategory(key) {
  currentCategory = key;
  renderTabs();
  renderGrid();
}

function getWallpapers(key) {
  if (!config) return [];
  if (config.wallpaperItems && config.wallpaperItems[key] && config.wallpaperItems[key].length > 0) {
    return config.wallpaperItems[key];
  }
  // 回退到wallpaperIds
  if (config.wallpaperIds && config.wallpaperIds[key]) {
    return config.wallpaperIds[key].map(function(id) {
      return {
        source: 'pexels',
        id: 'pexels-' + id,
        url: buildPexelsUrl(id, 1080),
        thumb: buildPexelsUrl(id, 400)
      };
    });
  }
  return [];
}

function renderGrid() {
  if (!config) return;
  var grid = document.getElementById('wallpaperGrid');
  var search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  var wallpapers = getWallpapers(currentCategory);

  if (search) {
    wallpapers = wallpapers.filter(function(w) {
      return (w.id && w.id.toLowerCase().indexOf(search) !== -1) ||
             (w.source && w.source.toLowerCase().indexOf(search) !== -1);
    });
  }

  if (wallpapers.length === 0) {
    grid.innerHTML = '<div class="empty"><p>该分类暂无壁纸</p><p style="font-size:13px;">点击右上角"+添加壁纸"添加</p></div>';
    return;
  }

  var html = '';
  wallpapers.forEach(function(wp, idx) {
    var thumb = wp.thumb || wp.url || '';
    var sourceClass = wp.source || 'pexels';
    var imgTag = thumb
      ? '<img src="' + escapeHtml(thumb) + '" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=img-error>图片加载失败</div>\'">'
      : '<div class="img-error">无图片</div>';

    html += '<div class="wallpaper-card">' +
      imgTag +
      '<div class="wallpaper-info">' +
        '<span class="wallpaper-id">' + escapeHtml(wp.id) + '</span>' +
        '<span class="wallpaper-source ' + sourceClass + '">' + escapeHtml(wp.source || 'pexels') + '</span>' +
      '</div>' +
      '<div class="wallpaper-actions">' +
        '<button class="btn btn-danger btn-sm" onclick="deleteWallpaper(' + idx + ')">🗑 删除</button>' +
        '<a class="btn btn-sm" style="background:var(--bg);color:var(--text);text-decoration:none;" href="' + escapeHtml(wp.url || thumb) + '" target="_blank">🔍 查看</a>' +
      '</div>' +
    '</div>';
  });

  grid.innerHTML = html;
}

function renderStats() {
  if (!config) return;
  document.getElementById('statsBar').style.display = 'flex';

  var total = 0;
  if (config.wallpaperItems) {
    Object.keys(config.wallpaperItems).forEach(function(key) {
      if (Array.isArray(config.wallpaperItems[key])) {
        total += config.wallpaperItems[key].length;
      }
    });
  }
  document.getElementById('totalWp').textContent = total;
  document.getElementById('totalCat').textContent = (config.categories || []).length;
  document.getElementById('totalBanner').textContent = (config.bannerIds || []).length;
}

// ============ 添加/删除 ============
function toggleAddPanel() {
  var panel = document.getElementById('addPanel');
  panel.classList.toggle('show');
}

// 存储待上传的文件和已上传的图片URL
var pendingFiles = [];
var uploadedImages = []; // [{url, thumb, name}]

/** 切换添加来源时显示/隐藏对应输入框 */
function onSourceChange() {
  var source = document.getElementById('addSource').value;
  var textInput = document.getElementById('addIdOrUrl');
  var fileInput = document.getElementById('addFileInput');
  var previewBtn = document.getElementById('previewBtn');
  var hint = document.getElementById('addHint');

  if (source === 'upload') {
    textInput.style.display = 'none';
    fileInput.style.display = 'inline-block';
    previewBtn.style.display = 'none';
    hint.textContent = '选择本地图片后自动预览。图片将上传到GitHub仓库托管，通过CDN加载，不会读不出来。支持多选。';
    pendingFiles = [];
    uploadedImages = [];
  } else {
    textInput.style.display = 'inline-block';
    fileInput.style.display = 'none';
    previewBtn.style.display = 'inline-flex';
    if (source === 'pexels') {
      hint.textContent = '输入Pexels图片ID后点击预览，确认图片内容后添加。支持批量添加：用逗号分隔多个ID。';
    } else {
      hint.textContent = '输入完整图片URL（需支持跨域访问），点击预览确认后添加。';
    }
  }
  document.getElementById('addPreview').innerHTML = '';
}

/** 文件选择回调 */
function onFileSelected() {
  var files = document.getElementById('addFileInput').files;
  if (!files || files.length === 0) return;

  pendingFiles = [];
  var previewHtml = '';

  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    if (!file.type.startsWith('image/')) continue;
    pendingFiles.push(file);
    previewHtml += '<div style="display:inline-block;margin:6px;text-align:center;position:relative;">' +
      '<img class="preview-img" src="' + URL.createObjectURL(file) + '">' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;max-width:120px;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(file.name) + '</div>' +
      '<div style="font-size:10px;color:var(--success);">' + (file.size/1024/1024).toFixed(2) + ' MB</div>' +
    '</div>';
  }

  document.getElementById('addPreview').innerHTML = previewHtml;
  document.getElementById('addHint').textContent = '已选择 ' + pendingFiles.length + ' 张图片，点击"确认添加"上传到GitHub并添加到壁纸列表';
}

/** 将文件转为base64 */
function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() {
      // 去掉 data:image/xxx;base64, 前缀
      var result = reader.result;
      var base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/** 获取文件扩展名 */
function getExt(filename) {
  var parts = filename.split('.');
  if (parts.length > 1) return parts[parts.length - 1].toLowerCase();
  return 'jpg';
}

/** 上传单张图片到GitHub */
async function uploadImageToGithub(file, repo, branch, token) {
  var ext = getExt(file.name);
  var timestamp = Date.now();
  var random = Math.floor(Math.random() * 10000);
  var filename = 'wp_' + timestamp + '_' + random + '.' + ext;
  var path = 'images/' + filename;

  var base64 = await fileToBase64(file);

  var url = GITHUB_API + '/repos/' + repo + '/contents/' + path;
  var res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: '上传壁纸: ' + file.name,
      content: base64,
      branch: branch
    })
  });

  if (!res.ok) {
    var err = await res.json();
    throw new Error(err.message || 'HTTP ' + res.status);
  }

  var data = await res.json();
  // 使用jsDelivr CDN URL（稳定且快）
  var cdnUrl = 'https://cdn.jsdelivr.net/gh/' + repo + '@' + branch + '/' + path;
  return {
    url: cdnUrl,
    thumb: cdnUrl,
    name: filename
  };
}

function previewAdd() {
  var cat = document.getElementById('addCategory').value;
  var source = document.getElementById('addSource').value;
  var input = document.getElementById('addIdOrUrl').value.trim();

  if (!cat) { showToast('请选择分类', 'error'); return; }
  if (!input) { showToast('请输入ID或URL', 'error'); return; }

  var previewDiv = document.getElementById('addPreview');
  var html = '';

  if (source === 'pexels') {
    // 支持批量：逗号分隔
    var ids = input.split(/[,，\s]+/).filter(function(s) { return s.trim(); });
    ids.forEach(function(id) {
      id = id.trim();
      html += '<div style="display:inline-block;margin:6px;text-align:center;">' +
        '<img class="preview-img" src="' + buildPexelsUrl(id, 400) + '" onerror="this.style.opacity=0.3">' +
        '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">ID: ' + escapeHtml(id) + '</div>' +
      '</div>';
    });
    document.getElementById('addHint').textContent = '共 ' + ids.length + ' 张，确认无误后点击"确认添加"';
  } else {
    html = '<div style="display:inline-block;margin:6px;text-align:center;">' +
      '<img class="preview-img" src="' + escapeHtml(input) + '" onerror="this.style.opacity=0.3">' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">自定义URL</div>' +
    '</div>';
    document.getElementById('addHint').textContent = '确认图片能正常显示后点击"确认添加"';
  }

  previewDiv.innerHTML = html;
}

async function confirmAdd() {
  var cat = document.getElementById('addCategory').value;
  var source = document.getElementById('addSource').value;

  if (!cat) { showToast('请选择分类', 'error'); return; }

  // 确保wallpaperItems存在
  if (!config.wallpaperItems) config.wallpaperItems = {};
  if (!config.wallpaperItems[cat]) config.wallpaperItems[cat] = [];

  var existing = new Set(config.wallpaperItems[cat].map(function(w) { return w.id; }));
  var added = 0;

  // ===== 本地上传模式 =====
  if (source === 'upload') {
    if (pendingFiles.length === 0) { showToast('请先选择文件', 'error'); return; }

    var repo = document.getElementById('repoInput').value.trim();
    var branch = document.getElementById('branchInput').value.trim();
    var token = document.getElementById('tokenInput').value.trim();

    if (!repo || !token) { showToast('请先填写仓库和Token', 'error'); return; }

    showLoading('正在上传 ' + pendingFiles.length + ' 张图片到GitHub...');

    for (var i = 0; i < pendingFiles.length; i++) {
      var file = pendingFiles[i];
      try {
        showLoading('上传中 (' + (i+1) + '/' + pendingFiles.length + '): ' + file.name);
        var result = await uploadImageToGithub(file, repo, branch, token);
        var wpId = 'upload-' + Date.now() + '-' + i;

        config.wallpaperItems[cat].push({
          source: 'custom',
          id: wpId,
          url: result.url,
          thumb: result.thumb
        });
        added++;
      } catch (err) {
        showToast('上传失败: ' + file.name + ' - ' + err.message, 'error');
        console.error(err);
      }
    }

    hideLoading();
    showToast('上传成功 ' + added + ' 张（记得点击保存）', 'success');
    pendingFiles = [];
    document.getElementById('addFileInput').value = '';
    document.getElementById('addPreview').innerHTML = '';
    renderTabs();
    renderGrid();
    renderStats();
    return;
  }

  // ===== Pexels / 自定义URL 模式 =====
  var input = document.getElementById('addIdOrUrl').value.trim();
  if (!input) { showToast('请输入ID或URL', 'error'); return; }

  if (source === 'pexels') {
    var ids = input.split(/[,，\s]+/).filter(function(s) { return s.trim(); });
    ids.forEach(function(id) {
      id = id.trim();
      var wpId = 'pexels-' + id;
      if (existing.has(wpId)) return;
      config.wallpaperItems[cat].push({
        source: 'pexels',
        id: wpId,
        url: buildPexelsUrl(id, 1080),
        thumb: buildPexelsUrl(id, 400)
      });
      existing.add(wpId);
      added++;
    });
  } else {
    var customId = 'custom-' + Date.now();
    config.wallpaperItems[cat].push({
      source: 'custom',
      id: customId,
      url: input,
      thumb: input
    });
    added++;
  }

  showToast('添加了 ' + added + ' 张壁纸（记得点击保存）', 'success');
  document.getElementById('addIdOrUrl').value = '';
  document.getElementById('addPreview').innerHTML = '';
  renderTabs();
  renderGrid();
  renderStats();
}

function deleteWallpaper(idx) {
  if (!config || !currentCategory) return;
  if (!config.wallpaperItems || !config.wallpaperItems[currentCategory]) return;

  var wp = config.wallpaperItems[currentCategory][idx];
  if (!wp) return;

  if (!confirm('确认删除 ' + wp.id + ' ？')) return;

  config.wallpaperItems[currentCategory].splice(idx, 1);
  showToast('已删除（记得点击保存）', 'success');
  renderTabs();
  renderGrid();
  renderStats();
}
