name: 自动更新壁纸

on:
  schedule:
    - cron: '0 18 * * */3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 运行爬虫抓取新壁纸
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node tools/crawler.js --source=pexels

      - name: 提交更新
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add remote-config.json
          if git diff --cached --quiet; then
            echo "没有新壁纸，跳过提交"
          else
            git commit -m "自动更新壁纸 $(date -u -d'+8 hours' '+%Y-%m-%d %H:%M')"
            git push
          fi
